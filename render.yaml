# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard → New → Blueprint → select this repo → Render reads
# this file and pre-fills everything below. You'll be prompted for the four
# `sync: false` values (secrets) during that flow — nothing else to configure.

services:
  - type: web
    name: budget-tracker-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ_NAME
        value: Asia/Kolkata
      - key: CORS_ORIGINS
        value: "*"        # tightened to the real frontend URL after that's deployed
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: AUTH_TOKEN
        sync: false        # paste the same token from your local backend/.env
      - key: ANTHROPIC_API_KEY
        sync: false        # optional — leave blank to skip AI categorization
      - key: DATABASE_URL
        sync: false        # the Supabase pooler connection string
