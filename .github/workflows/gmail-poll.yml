name: Poll Gmail for bank alerts

# HDFC (and possibly other banks later) emails every transaction alert for
# this account instead of texting it — SMS-only automation (MacroDroid)
# never sees those. This calls the backend's own poller on a schedule so new
# alerts get ingested automatically, the same way MacroDroid does for SMS.
# See backend/gmail_poll.py for the one-time OAuth setup this depends on.
#
# RESUMED 2026-09-22, after a full incident: the Google Cloud OAuth consent
# screen for this project was left in "Testing" status, which expires every
# refresh token after exactly 7 days no matter how the app is used. A
# reconnect on 27 Aug worked until 3 Sep, then failed silently on every
# 15-minute run for 19 straight days (~1,800 failure notifications) until
# someone noticed. Fixed permanently by publishing the consent screen to
# "In production" in Google Cloud Console (project 716976157127) — that
# removes the 7-day expiry for good, no periodic reconnect needed.
#
# The 19-day backlog that piled up during the outage exposed a second, real
# bug: fetch_new_alerts() used to fetch an unbounded amount of backlog in one
# call, which the free tier's 512MB instance couldn't handle, and because the
# sync watermark only advanced on full success, every retry repeated the same
# impossible fetch forever. Fixed in gmail_poll.py: each poll now covers at
# most MAX_CATCHUP_DAYS_PER_POLL days and saves real, incremental progress —
# a large gap closes over several small polls instead of one that can't
# succeed. The 19-day backlog was manually run down after the fix landed;
# steady state now takes one poll per hour to stay current.
#
# Hourly rather than every 15 minutes deliberately: SMS (MacroDroid) is the
# faster, primary channel for the same alerts, and Gmail is the backup — a
# slower schedule means any future failure generates a quarter as many
# notifications before it's noticed.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /gmail/poll
        env:
          APP_AUTH_TOKEN: ${{ secrets.APP_AUTH_TOKEN }}
        run: |
          # Fail loudly, never quietly. The previous version only emitted a
          # ::warning:: on a bad response, so a missing APP_AUTH_TOKEN secret
          # produced a 401 that still reported the run as SUCCESS — every run
          # looked green for two days while nothing was being ingested at all.
          # A silent capture pipeline is worse than no capture pipeline: you
          # believe your spending is being tracked when it isn't.
          if [ -z "$APP_AUTH_TOKEN" ]; then
            echo "::error::APP_AUTH_TOKEN repository secret is not set — the poll cannot authenticate."
            echo "Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 120 \
            -X POST https://budget-tracker-api-jkub.onrender.com/gmail/poll \
            -H "Authorization: Bearer $APP_AUTH_TOKEN")
          echo "Response ($code):"
          cat /tmp/resp.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Gmail poll returned $code — new bank emails are NOT being captured."
            exit 1
          fi
